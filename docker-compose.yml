# Backing services for local development: docker compose up -d
# The apps run from source with "npm run dev" for now; they join this file when the Dockerfiles do
# (week 6).
services:
  mongo:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    ports: ['27017:27017']

  redis:
    image: redis:8
    volumes: [redis-data:/data]
    ports: ['6379:6379']

volumes:
  mongo-data:
  redis-data:
