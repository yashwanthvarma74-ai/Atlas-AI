name: Deploy

# Runs after CI has passed on main, so a red step anywhere blocks a deploy. The web app deploys itself: Vercel builds
# every pull request as a preview and main as production. The API is deployed here, through a deploy hook, because
# render.yaml turns off Render's own deploy-on-push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    name: Publish the API image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build and push to the GitHub container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/yashwanthvarma74-ai/atlas-api
          docker build -f apps/api/Dockerfile -t "$image:latest" -t "$image:${{ github.event.workflow_run.head_sha }}" .
          docker push "$image:latest"
          docker push "$image:${{ github.event.workflow_run.head_sha }}"

  space:
    name: Restart the Hugging Face Space
    runs-on: ubuntu-latest
    needs: image
    steps:
      # a restart pulls the image just published; without a token there is nothing to restart
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE is not set, so the Space is not restarted."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/spaces/$SPACE/restart?factory=true"

  api:
    name: Deploy the API
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Ask Render to deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, so there is nothing to deploy to."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
