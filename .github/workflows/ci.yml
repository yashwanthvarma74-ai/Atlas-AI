name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    # the tests run against a real MongoDB with Atlas Search, Redis and an S3 server, exactly like local development
    services:
      # Atlas Local: MongoDB with Atlas Search and Vector Search, which the retrieval tests need
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports: ['27017:27017']
      redis:
        image: redis:8
        ports: ['6379:6379']
      s3:
        image: adobe/s3mock
        ports: ['9090:9090']
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: atlas-test
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9090
      MONGODB_TEST_URL: mongodb://127.0.0.1:27017
      SEARCH_TEST_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check (strict)
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
