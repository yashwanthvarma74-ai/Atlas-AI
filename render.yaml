# One free web service: the API with the ingest worker inside it. Secrets are asked for when the blueprint is
# applied, so none are in this file. See docs/DEPLOY.md.
services:
  - type: web
    name: atlas-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # deployed by .github/workflows/deploy.yml once CI has passed, through this service's deploy hook
    autoDeploy: false
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: INLINE_WORKER, value: 'true' }
      - { key: PARSE_ISOLATION, value: process }
      # the worker shares a 0.1 CPU machine with the API, so one document at a time keeps pages responsive
      - { key: INGEST_CONCURRENCY, value: '1' }
      # embeddings run in this service on its CPU (the model is in the image): no key, no quota
      - { key: EMBEDDING_PROVIDER, value: local }
      - { key: EMBEDDING_MODEL, value: Xenova/bge-small-en-v1.5 }
      - { key: EMBEDDING_DIMENSIONS, value: '384' }
      - { key: EMBEDDING_THREADS, value: '1' }
      # a change of embedder rebuilds the vector index and re-embeds the documents by itself
      - { key: VECTOR_INDEX_REBUILD, value: 'true' }
      # the answer model; the key is set in the dashboard
      - { key: LLM_PROVIDER, value: gemini }
      - { key: GEMINI_API_KEY, sync: false }
      # the browser reaches the API through the web app's proxy, so there are two hops in front of it
      - { key: TRUST_PROXY_HOPS, value: '2' }
      # the web app's public address; writes naming any other origin are refused
      - { key: SITE_ORIGIN, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      # must end in a database name, for example .../atlas_ai?retryWrites=true&w=majority
      - { key: MONGODB_URI, sync: false }
      # the rediss:// address, with TLS
      - { key: REDIS_URL, sync: false }
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: S3_BUCKET, value: atlas-uploads }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
